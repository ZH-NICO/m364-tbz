#cloud-config
users: # Liste der Benutzer, die beim ersten Start erstellt werden
  - default # Standardbenutzer ubuntu bleibt bestehen
  - name: nico # mein eigener Benutzer
    sudo: ALL=(ALL) NOPASSWD:ALL # darf sudo ohne Passwort benutzen
    shell: /bin/bash # bash als Shell
    ssh_authorized_keys: # diese öffentlichen Schlüssel dürfen sich als nico einloggen
      - ssh-rsa  nico1 # mein Public Key (nico1)
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoD9CeG7EebhVT6XhzQExfS91f059/rUUSvnktx/FU3 vanEssen # Public Key meiner Lehrperson (Jonas van Essen), damit sie auf meine Instanzen zugreifen kann

ssh_pwauth: false # Login mit Passwort per SSH verbieten, nur noch mit Schlüssel
disable_root: true # direkter SSH-Login als root ist gesperrt

package_update: true # beim ersten Start die Paketliste aktualisieren (apt update)
